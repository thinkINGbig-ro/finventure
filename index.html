<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E1638">
  <meta name="description" content="Finventure: un joc despre bani, decizii și viață, de la 18 la 65 de ani.">
  <meta name="finventure-cod" content="2026-11-25">
  <title>Finventure</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <div id="erori-continut" class="erori-continut" hidden></div>

    <header class="antet">
      <div class="antet-sus">
        <span class="wordmark" aria-label="Finventure"><span class="fin">Fin</span>venture</span>
        <span class="antet-butoane">
          <button id="btn-avere" class="btn-icon" type="button" aria-label="Averea ta netă, an de an" aria-haspopup="dialog">📈</button>
          <button id="btn-concepte" class="btn-icon" type="button" aria-label="Enciclopedia: conceptele descoperite" aria-haspopup="dialog">📖</button>
          <button id="btn-meniu" class="btn-icon" type="button" aria-label="Meniu joc" aria-haspopup="dialog">⋯</button>
        </span>
      </div>
      <div class="identitate">
        <div>
          <div id="nume" class="nume"></div>
          <div id="varsta" class="varsta"></div>
          <div id="stil" class="stil-chip"></div>
        </div>
        <div class="bani-sus">
          <span class="eticheta-mica">Bani disponibili</span>
          <span id="bani-total" class="suma-bani"></span>
        </div>
      </div>
      <div id="bare" class="bare"></div>
    </header>

    <main class="jurnal-zona">
      <h2 class="sr-only">Jurnalul vieții</h2>
      <ol id="jurnal" class="jurnal" aria-live="polite"></ol>
    </main>

    <footer class="subsol">
      <div id="toasturi" class="toasturi" aria-live="polite"></div>
      <button id="btn-avanseaza" class="btn-avanseaza" type="button">
        <span class="btn-avanseaza-text">Avansează</span>
        <span class="btn-avanseaza-sub">+1 an</span>
      </button>
      <nav class="taburi" aria-label="Meniuri">
        <button type="button" class="tab" data-tab="activitati"><span class="tab-icon" aria-hidden="true">🎯</span>Activități</button>
        <button type="button" class="tab" data-tab="banca"><span class="tab-icon" aria-hidden="true">🏦</span>Bancă</button>
        <button type="button" class="tab" data-tab="investitii"><span class="tab-icon" aria-hidden="true">📈</span>Investiții</button>
        <button type="button" class="tab" data-tab="cariera"><span class="tab-icon" aria-hidden="true">💼</span>Carieră</button>
        <button type="button" class="tab" data-tab="educatie"><span class="tab-icon" aria-hidden="true">🎓</span>Educație</button>
        <button type="button" class="tab" data-tab="cumparaturi"><span class="tab-icon" aria-hidden="true">🛒</span>Cumpărături</button>
      </nav>
    </footer>

    <div id="strat" class="strat" hidden></div>
  </div>

  <noscript><p class="noscript">Finventure are nevoie de JavaScript.</p></noscript>
  <script>
    // Cache-ul după o actualizare: GitHub Pages lasă browserul să țină fișierele 10 minute fără să întrebe,
    // așa că un jucător poate primi un amestec de fișiere vechi și noi. La pornire, modulele se verifică la
    // server (cereri condiționate: 304 dacă nu s-au schimbat) urmărind importurile din main.js; datele JSON
    // se cer oricum așa (js/content.js). Dacă tot apare o nepotrivire (un export lipsă, o pagină veche),
    // finventureRepara cere totul din nou și reîncarcă: cel mult o dată la 5 minute, ca să nu intre în buclă.
    const IMPORTURI = /(?:import|export)\s[^'"]*?from\s*['"](\.{1,2}\/[^'"]+)['"]|import\s*\(?\s*['"](\.{1,2}\/[^'"]+)['"]/g;
    async function improspateaza(radacini, mod) {
      const vazute = new Set();
      const descarca = async (url) => {
        if (vazute.has(url)) return;
        vazute.add(url);
        try {
          const text = await (await fetch(url, { cache: mod })).text();
          if (!new URL(url).pathname.endsWith('.js')) return;
          await Promise.all([...text.matchAll(IMPORTURI)].map((m) => descarca(new URL(m[1] ?? m[2], url).href)));
        } catch { /* fără rețea: merge din cache */ }
      };
      await Promise.all(radacini.map((cale) => descarca(new URL(cale, location.href).href)));
      return vazute.size;
    }
    window.finventurePregateste = () => improspateaza(['js/main.js'], 'no-cache');
    window.finventureRepara = async function (motiv) {
      const CHEIE = 'finventure-reparat';
      try {
        const ultima = Number(sessionStorage.getItem(CHEIE) || 0);
        if (Date.now() - ultima < 5 * 60 * 1000) return false;
        sessionStorage.setItem(CHEIE, String(Date.now()));
      } catch {
        return false;
      }
      console.warn('[pornire] fișiere din versiuni diferite în cache; le cer din nou:', motiv);
      await improspateaza([location.href.split('#')[0], './', 'css/style.css', 'js/main.js'], 'reload');
      location.reload();
      return true;
    };
  </script>
  <script type="module">
    window.finventurePregateste().then(() => import('./js/main.js')).catch(async (e) => {
      console.error(e);
      if (await window.finventureRepara(`modul: ${e.message}`)) return;
      const app = document.getElementById('app');
      const card = document.createElement('div');
      card.className = 'card';
      card.style.margin = '16px';
      card.innerHTML = '<h2>Jocul nu a putut porni</h2><p>Reîncarcă pagina peste câteva minute. Salvarea ta rămâne pe acest dispozitiv.</p>';
      app.replaceChildren(card);
    });
  </script>
</body>
</html>
